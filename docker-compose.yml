services:
  nginx:
    image: nginx:1.24
    restart: "no"
    ports:
      - "${APP_PORT}:80"
    volumes:
      - .:/var/app/
      - ./.docker/logs/nginx/:/var/log/nginx
      - ./.docker/config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app
      - net-global
  php:
    build:
      context: ./.docker
    restart: "no"
    working_dir: /var/app
    volumes:
      - .:/var/app/
      - ./.docker/config/php/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./.docker/sqlite/data:/sqlite
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    networks:
      - app
      - net-global
  worker:
    build:
      context: ./.docker
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3
    working_dir: /var/app
    volumes:
      - .:/var/app/
    networks:
      - app
      - net-global
  redis:
    image: redis:7.4.0-alpine
    restart: "no"
    networks:
      - app
      - net-global
  mysql:
    image: mysql:latest
    restart: "no"
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql:/var/lib/mysql
    security_opt:
      - seccomp:unconfined
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - app
      - net-global
networks:
  app:
    driver: bridge
  net-global:
    name: net-global
    external: true

volumes:
  mysql:
  redis:
