services:
  frontend:
    image: nginx:1.24
    restart: "no"
    ports:
      - "${APP_PORT_FRONTEND}:80"
    volumes:
      - .:/var/app/
      - ./.docker/config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
  backend:
    image: nginx:1.24
    restart: "no"
    ports:
      - "${APP_PORT_BACKEND}:80"
    volumes:
      - .:/var/app/
      - ./.docker/config/nginx/backend.conf:/etc/nginx/conf.d/default.conf
  php:
    build:
      context: ./.docker
    restart: "no"
    working_dir: /var/app
    volumes:
      - .:/var/app/
      - ./.docker/config/php/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./.docker/sqlite/data:/sqlite
#    extra_hosts:
#      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:latest
    restart: "no"
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql:/var/lib/mysql
    security_opt:
      - seccomp:unconfined
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}

volumes:
  mysql:
